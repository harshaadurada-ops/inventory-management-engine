[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-management-engine"
version = "1.0.0"
description = "A validated inventory management engine with JSON persistence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
inventory = "inventory_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]